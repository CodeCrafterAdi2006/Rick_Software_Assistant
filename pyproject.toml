[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_system"
version = "0.1.0"
description = "AI Software Engineering Assistant built with OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.19.0",
    "pydantic>=2.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
